<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="scss/style.css" rel="stylesheet"/>
    <title>Lucid | Store</title>
  </head>
  <body class="outer-screen ">
      <!-- Header -->
    <header id="outer-header" class="d-flex align-items-center justify-content-center">
        <div class="brand">
            <svg class="lucid-logo">
                <use xlink:href="images/svg-sprite.svg#lucid-logo"></use>
            </svg>
        </div>
    </header>
    <!-- Header End -->
    <!-- Body -->
    <div class="text-center">
        <h2>Who is using Scottsdale AZ Studio</h2>
        <div class="container">
            <div class="row user-row align-items-center justify-content-center flex-column">
                <div class="col-md-3 col-sm-6 d-inline-flex justify-content-center">
                    <div class="user-box d-flex flex-column align-items-center">
                        <a href="dashboard.html" class="block-link"></a>
                            <div class="user-img">
                                <img src="images/george-colvin.png" alt=""/>
                            </div>
                            <div class="content">
                                <h3>George Colvin</h3>
                            </div>
                    </div>
                </div>
                <div class="password-wrapper d-flex align-items-center justify-content-center">
                    <input class="inputs" type="password" maxlength="1" placeholder="0" />
                    <input class="inputs" type="password" maxlength="1" placeholder="0"/>
                    <input class="inputs" type="password" maxlength="1"  placeholder="0"/>
                    <input class="inputs" type="password" maxlength="1"  placeholder="0"/>
                </div>
                <div class="finger-print">
                    <svg class="icon">
                        <use xlink:href="images/svg-sprite.svg#icon-finger-print"></use>
                    </svg>
                      </div>  
                </div>
            </div>
        </div>

    <!-- Body End -->
    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="src/jquery-1.11.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="src/slick.min.js"></script>
    <script src="src/aos.js"></script>
    <script src="src/main.js"></script>
    
  </body>
</html>
