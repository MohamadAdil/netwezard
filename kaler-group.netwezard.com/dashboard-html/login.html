<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta content="Coderthemes" name="author" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />

<!-- App Title -->
<title>Dashboard | Kaler Group</title>

<!-- App favicon -->
<link rel="shortcut icon" href="images/favicon.png" type="image/x-icon" />

<!-- App css -->
<link href="css/bootstrap.min.css" rel="stylesheet" type="text/css" />
<link href="css/icons.min.css" rel="stylesheet" type="text/css" />
<link href="css/summernote-bs4.css" rel="stylesheet" type="text/css" />

<!-- third party css -->
<link
      href="css/vendor/dataTables.bootstrap4.css"
      rel="stylesheet"
      type="text/css"
    />
<link
      href="css/vendor/switchery.min.css"
      rel="stylesheet"
      type="text/css"
    />
<link href="css/vendor/toastr.min.css" rel="stylesheet" type="text/css" />
<!-- third party css end -->

<link href="css/app.css" rel="stylesheet" type="text/css" />

<!-- page css -->
</head>

<body class="authentication-bg">
<div class="account-pages mt-5 mb-5"> 
  <!-- Start Content-->
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7">
        <div class="card">
          <div class="card-body">
            <div class="text-center w-75 m-auto"> <span
                    ><img src="images/logo.png" alt="logo" height="80"
                  /></span>
              <p class="text-muted mb-4 mt-3">Login Into Admin Panel.</p>
            </div>
            <form>
              <input
                    type="hidden"
                    name="_token"
                    value="zdINjWp1IAHgCZFYQZ60EiIjkBcTtNwPLbwCaScw"
                  />
              <div class="form-group row">
                <label
                      for="email"
                      class="col-md-4 col-form-label text-md-right"
                      >E-Mail Address</label
                    >
                <div class="col-md-6">
                  <input
                        id="email"
                        type="email"
                        class="form-control"
                        name="email"
                        value="admin@mail.com"
                        required
                        autocomplete="email"
                        autofocus
                      />
                </div>
              </div>
              <div class="form-group row">
                <label
                      for="password"
                      class="col-md-4 col-form-label text-md-right"
                      >Password</label
                    >
                <div class="col-md-6">
                  <input
                        id="password"
                        type="password"
                        class="form-control"
                        name="password"
                        value="admin1234"
                        required
                        autocomplete="current-password"
                      />
                </div>
              </div>
              <div class="form-group row">
                <div class="col-md-6 offset-md-4">
                  <div class="custom-control custom-checkbox">
                    <input
                          class="custom-control-input"
                          type="checkbox"
                          name="remember"
                          id="remember"
                        />
                    <label class="custom-control-label" for="remember"> Remember Me </label>
                  </div>
                </div>
              </div>
              <div class="form-group row mb-0">
                <div class="col-md-8 offset-md-4">
                  <input
                        type="submit"
                        name="submit"
                        class="btn btn-primary"
                        value="Login"
                      />
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- End Content--> 
</div>
<!-- END wrapper --> 

<!-- App js --> 
<script src="js/vendor.min.js"></script> 
<script src="js/all.min.js"></script> 
<script src="js/summernote-bs4.js"></script> 

<!-- third party js --> 
<script src="js/vendor/jquery.dataTables.js"></script> 
<script src="js/vendor/dataTables.bootstrap4.js"></script> 
<script src="js/vendor/switchery.min.js"></script> 
<script src="js/vendor/toastr.min.js"></script> 
<!-- third party js ends --> 

<!-- Toastr message display --> 
<script type="text/javascript">
      toastr.options = {
        closeButton: true,
        closeClass: "toast-close-button",
        closeDuration: 300,
        closeEasing: "swing",
        closeHtml: '<button><i class="icon-off"><\/i><\/button>',
        closeMethod: "fadeOut",
        closeOnHover: true,
        containerId: "toast-container",
        debug: false,
        escapeHtml: false,
        extendedTimeOut: 10000,
        hideDuration: 1000,
        hideEasing: "linear",
        hideMethod: "fadeOut",
        iconClass: "toast-info",
        iconClasses: {
          error: "toast-error",
          info: "toast-info",
          success: "toast-success",
          warning: "toast-warning",
        },
        messageClass: "toast-message",
        newestOnTop: false,
        onHidden: null,
        onShown: null,
        positionClass: "toast-top-right",
        preventDuplicates: true,
        progressBar: true,
        progressClass: "toast-progress",
        rtl: false,
        showDuration: 300,
        showEasing: "swing",
        showMethod: "fadeIn",
        tapToDismiss: true,
        target: "body",
        timeOut: 5000,
        titleClass: "toast-title",
        toastClass: "toast",
      };
    </script> 
<script src="js/app.js"></script>
</body>
</html>
