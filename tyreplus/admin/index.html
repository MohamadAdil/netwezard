<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>TyrePlus Edinburgh - CMS</title>
<link href="css/tyreplus_admin.css" type="text/css" rel="stylesheet" />
<link rel="icon" type="image/png" href="images/favicon.png"/>
</head>

<body>
<div id="mainwrapper">
	<!-- Header Start -->
    <div id="header">
    	<div class="headerinner">
        	<a href="index.html" class="logo"></a>
            	<ul id="headtopnav">
                	<li>Welcome - Admin</li>
                    <li class="seprator"></li>
                    <li><a href="#" class="powerbtn" title="Logout"></a></li>
                </ul>
        </div>
    </div>
    <!-- Header End -->
	
    <!-- Main Start -->
    <div class="main">
    	<h2>Directory Listing</h2>
        <div class="datatable">
        	<div class="tabletophead">
            	<h3>Fill entries of car:</h3>
            </div>
            <div class="bgright">
            <form id="cardetail">
            	<fieldset>
                	<label>Title</label>
                    <input type="text" name="title" class="title"/>
                </fieldset>
                 <fieldset class="last">
                	<label>Upload Image</label>
                    <input type="file" class="imageupload"  size="55"/>
                </fieldset>
                <div class="clearfix"></div>
                <fieldset>
                	<label>Make(all)</label>
                    <input id="make" name="make" type="text"/>
                </fieldset>
                <fieldset>
                	<label>Model(any)</label>
                    <input id="model" name="model" type="text"/>
                </fieldset>
                <fieldset>
                	<label>Min Price</label>
                    <input id="minprice" name="minprice" type="text"/>
                </fieldset>
                 <fieldset class="last">
                	<label>Max Price</label>
                    <input id="maxprice" name="maxprice" type="text"/>
                </fieldset>
                <fieldset>
                	<label>Body Type(all)</label>
                    <input id="bodyType" name="bodyType" type="text"/>
                </fieldset>
                <fieldset>
                	<label>Mileage(any)</label>
                    <input id="maximumMileage" name="maximumMileage" type="text"/>
                </fieldset>
                
                <fieldset>
                	<label>Engine Size(any)</label>
                    <input id="engineSize" name="engineSize" type="text"/>
                </fieldset>
                 <fieldset class="last">
                	<label>Fuel Type(any)</label>
                    <input id="fuelType" name="fuelType" type="text"/>
                </fieldset>
                 <fieldset>
                	<label>Gearbox(any)</label>
					<input id="gearbox" name="gearbox" type="text"/>
                </fieldset>
                <fieldset>
                	<label>Age(any)</label>
					<input id="age" name="age" type="text"/>
                </fieldset>
                <fieldset>
                	<label>No. of doors(any)</label>
					<input id="numberOfDoors" name="numberOfDoors" type="text"/>
                </fieldset>
                <fieldset class="last">
                	<label>Colour(all)</label>
					<input id="colour" name="colour" type="text" />
               </fieldset>
               <div class="fulllength">
                <fieldset>
                	<label>Description</label>
					<textarea name="description" class="description"></textarea>
               </fieldset>
               <div class="rightpart">
                 <fieldset>
                	<label>Price</label>
					<input type="text" />
               </fieldset>
               <div class="clearfix"></div>
               <h2>Upload Thumb Images</h2>
               <input name="" type="file" class="thumbupload"  size="55"/>
               <input name="" type="file" class="thumbupload"  size="55"/>
               <input name="" type="file" class="thumbupload"  size="55"/>
               <a href="#" class="link">+ add more images</a>
               </div>
               </div>
                <fieldset>
                <input type="button" value="Submit" class="submit">
                <input type="button" value="Cancel" class="submit">
                </fieldset>
            </form>
			</div>
            <div class="tablebotbg"></div>
        </div>
    </div>
    <!-- Main End -->
    
    <!-- Footer Start -->
    <div id="footer">
        <p>© 2013 TyrePlus. All rights reserved.</p>
    </div>
    <!-- Footer End -->
    
</div>
</body>
</html>
